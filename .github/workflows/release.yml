name: Release artifact

# Builds the client once, here, and attaches it to the release.
#
# The alternative — every server building for itself — is what this replaces.
# It needs ~830 MB of RSS for the Vite build and ~620 MB for the type check,
# which a small LXC container does not have; the build died with "JavaScript
# heap out of memory" on a machine that runs the app itself perfectly well.
# Nothing about that build is host-specific, so doing it once is both cheaper
# and more reproducible than doing it everywhere.
#
# `server/` needs no npm packages at all — it imports only Node builtins — so a
# host that takes this artifact needs neither a toolchain nor node_modules.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the artifact to
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The artifact is what people will run. Publishing one that fails its own
      # tests would be worse than publishing none.
      - run: npm test
      - run: npx oxlint src server

      # Deliberately no VITE_BASE, VITE_DEMO or VITE_JELLYFIN_SERVER: those
      # belong to the Pages demo, and a self-hosted build must be served from
      # the root with no banner and no baked-in server address.
      - run: npm run build

      - name: Pack the client
        run: |
          tag='${{ github.event.release.tag_name || inputs.tag }}'
          # `dist` at the root of the tarball, so extraction lands where the
          # server expects it and cannot scatter files if run from elsewhere.
          tar -czf "apollo-dist-${tag}.tar.gz" dist
          sha256sum "apollo-dist-${tag}.tar.gz" > "apollo-dist-${tag}.tar.gz.sha256"
          ls -la apollo-dist-*

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.event.release.tag_name || inputs.tag }}'
          gh release upload "$tag" \
            "apollo-dist-${tag}.tar.gz" \
            "apollo-dist-${tag}.tar.gz.sha256" \
            --clobber
