name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build the demo
        env:
          # Project pages live under /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Turns on the banner explaining the HTTPS requirement.
          VITE_DEMO: '1'
          # No default server: the demo asks visitors for their own.
          VITE_JELLYFIN_SERVER: ''
        run: npm run build

      # Pages has no SPA rewrite, so a deep link like /Apollo/item/123 would
      # 404. Serving index.html as the 404 page lets the router take over.
      - run: cp dist/index.html dist/404.html

      # Stops Jekyll from swallowing files, which it does by default on Pages.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
